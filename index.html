<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151b"><title>Dino Run | 3D City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151b20;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-shadow:0 2px 6px #000}.top{display:flex;justify-content:space-between;gap:8px}.pill{background:#101820c9;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;font-size:clamp(11px,1.7vw,14px);backdrop-filter:blur(8px)}.big{font-weight:950;letter-spacing:.1em;font-size:clamp(15px,2.3vw,23px)}#help{align-self:center;margin-top:auto;margin-bottom:9px;font-size:clamp(10px,1.5vw,13px);color:#e3eeee;text-align:center;background:#101820c9;padding:6px 10px;border-radius:20px}#dino-bars{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}.dino-bar{position:absolute;width:74px;transform:translate(-50%,-50%);display:none;text-align:center}.dino-bar-name{font-size:10px;font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 1px 3px #000;margin-bottom:3px}.dino-bar-track{height:7px;background:#301b1b;border:1px solid #fff9;border-radius:5px;overflow:hidden;box-shadow:0 2px 5px #0008}.dino-bar-fill{height:100%;width:100%;background:#62e58b;transition:width .12s,background .12s}#crosshair{position:fixed;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none;z-index:4;display:none;filter:drop-shadow(0 1px 2px #000)}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;border:1px solid #101820;border-radius:2px}#crosshair:before{width:2px;height:28px;left:13px;top:0}#crosshair:after{height:2px;width:28px;top:13px;left:0}#controls{position:fixed;inset:auto 0 0;display:flex;justify-content:space-between;align-items:end;padding:12px;pointer-events:none}.control{pointer-events:auto;border:1px solid #ffffff55;color:white;background:#101820d9;border-radius:50%;width:clamp(64px,10vw,88px);height:clamp(64px,10vw,88px);font-size:clamp(12px,1.8vw,16px);font-weight:900;box-shadow:0 5px 18px #0007;touch-action:none}.control:active{transform:scale(.94);background:#238a70}.right{display:flex;gap:10px;align-items:end}.small{width:44px;height:44px;font-size:18px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#071019df;backdrop-filter:blur(10px);padding:22px;text-align:center}#panel{width:min(280px,82vw);padding:24px 20px;border:1px solid #ffffff26;border-radius:18px;background:#101820d9;box-shadow:0 18px 70px #0008}h1{font-size:clamp(27px,5vw,39px);line-height:1;margin:0 0 20px;letter-spacing:.04em;white-space:nowrap;text-shadow:0 3px 18px #000}#start{border:0;border-radius:10px;background:#66edbc;color:#06231c;padding:12px 28px;font-weight:950;font-size:14px;letter-spacing:.08em;box-shadow:0 4px 22px #66edbc35}#rotate{display:none;position:fixed;inset:0;background:#101923;z-index:10;place-items:center;text-align:center;padding:30px}@media (orientation:portrait) and (max-width:700px){#rotate{display:grid}}@media(orientation:landscape){#controls{padding:8px 15px}#help{margin-bottom:3px}}
</style></head><body>
<canvas id="game"></canvas><div id="dino-bars" aria-hidden="true"></div><div id="crosshair" aria-hidden="true"></div><div id="hud"><div class="top"><div class="pill"><div class="big">DINO RUN</div><div>T-REX ENCOUNTER · 3D</div></div><div class="pill">EXIT <b id="distance">120 m</b><br>THREATS <b id="count">5</b></div></div><div id="help">DRAG TO AIM · SHOOT ONLY WHAT THE CROSSHAIR HITS</div></div>
<div id="controls"><button class="control" id="aim">AIM<br>⌖</button><div class="right"><button class="control small" id="full">⛶</button><button class="control" id="shoot">PULSE<br>●</button></div></div>
<div id="overlay"><div id="panel"><h1>DINO RUN</h1><button id="start">PLAY ▶</button></div></div>
<div id="rotate"><div><div style="font-size:46px">↻</div><h2>ROTATE YOUR PHONE</h2><p>Designed for landscape mode.</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
(()=>{
const canvas=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9aa9aa);scene.fog=new THREE.Fog(0x9aa9aa,35,125);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,180);camera.position.set(0,2.25,8);camera.lookAt(0,1.8,-30);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
scene.add(new THREE.HemisphereLight(0xdce8f1,0x45413a,2.1));const sun=new THREE.DirectionalLight(0xffe3bd,3.0);sun.position.set(-15,28,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(color,roughness=.85,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const asphalt=mat(0x353a39),concrete=mat(0x858176),curb=mat(0xb5ad9a),brickMats=[mat(0x746b60),mat(0x77766b),mat(0x666d6b),mat(0x84786a)],windowMats=[mat(0x40575d,.28,.25),mat(0x273b43,.25,.35),mat(0x8a8c82,.3,.18)],dark=mat(0x252c2c,.55,.15),metal=mat(0x394241,.35,.65);
function box(parent,geoMat,pos,scale,cast=true,receive=true){const m=new THREE.Mesh(new THREE.BoxGeometry(...scale),geoMat);m.position.set(...pos);m.castShadow=cast;m.receiveShadow=receive;parent.add(m);return m}
function sphere(parent,material,pos,scale,seg=16){const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,Math.max(8,Math.floor(seg*.65))),material);m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,material,pos,rt,rb,height,seg=10){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,height,seg),material);m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
const ground=box(scene,asphalt,[0,-.18,-45],[18,.35,115],false,true);box(scene,concrete,[-10,-.14,-45],[2,.3,115],false,true);box(scene,concrete,[10,-.14,-45],[2,.3,115],false,true);box(scene,curb,[-8.95,.02,-45],[.16,.25,115]);box(scene,curb,[8.95,.02,-45],[.16,.25,115]);
const lineMat=mat(0xc4b99d,.8);for(let z=4;z>-105;z-=8){box(scene,lineMat,[0,.005,z],[.16,.018,3.3],false,false)}
// Repeated 3D city blocks, set back on both sides so the road stays open.
for(let side of [-1,1])for(let i=0;i<13;i++){let z=2-i*8.5,width=5+Math.random()*3,height=7+Math.random()*11,x=side*(12+Math.random()*2),building=new THREE.Group();building.position.set(x,height/2,z);scene.add(building);box(building,brickMats[(i+(side>0?1:0))%brickMats.length],[0,0,0],[width,height,7+Math.random()*3]);box(building,mat(0x3c403d),[0,height/2+.12,0],[width+.25,.25,7.4]);const floors=Math.floor(height/2.35),cols=Math.max(2,Math.floor(width/1.45));for(let fy=0;fy<floors;fy++)for(let col=0;col<cols;col++){let wx=-width/2+.65+col*(width-1.1)/cols,wy=-height/2+1.25+fy*2.25;box(building,mat(0x383a37),[wx,wy,3.56],[.88,1.3,.12],false);let win=box(building,windowMats[(i+col+fy)%windowMats.length],[wx,wy,3.48],[.68,1.05,.08],false);if((i+col+fy)%5===0)box(building,mat(0xb9a780),[wx,wy-.6,3.4],[.75,.08,.15],false);box(building,mat(0xaaa18f),[wx,wy+.59,3.4],[.85,.09,.17],false)}}
// Street lamps and parked cars along the curbs
for(let side of [-1,1])for(let i=0;i<7;i++){let z=-i*15-2,x=side*8.05; cylinder(scene,metal,[x,2.1,z],.075,.11,4.2);box(scene,metal,[x-side*.45,4.15,z],[.95,.09,.12]);sphere(scene,mat(0xf3d6a0,.3),[x-side*.82,4.05,z],[.22,.12,.17],12)}
function car(x,z,color){const group=new THREE.Group();group.position.set(x,.1,z);scene.add(group);const body=mat(color,.36,.25),glass=mat(0x314247,.2,.4),rubber=mat(0x171a1a,.9);box(group,body,[0,.55,0],[2.1,.65,4.1]);box(group,body,[0,1.05,-.2],[1.55,.62,2.15]);box(group,glass,[0,1.12,.91],[1.32,.42,.06],false);box(group,glass,[0,1.12,-1.25],[1.32,.42,.06],false);for(let sx of [-1,1])for(let sz of [-1,1]){let wheel=cylinder(group,rubber,[sx*1.04,.35,sz*1.25],.34,.34,.22,12);wheel.rotation.z=Math.PI/2}for(let sx of [-.65,.65]){box(group,mat(0xe4d6aa,.3),[sx,.62,2.07],[.35,.15,.06],false);box(group,mat(0xa33b2e,.3),[sx,.62,-2.07],[.35,.15,.06],false)}}
car(-6.7,-12,0x66716d);car(6.7,-30,0x777165);car(-6.8,-48,0x495c64);
// Detailed stylized-realistic 3D dinosaur: body, limbs, tail, head, jaw, eyes and back spines.
const dinoMats=[{skin:mat(0x4b5940,.92),belly:mat(0x9b8b6a),ridge:mat(0x35402d),eye:mat(0xcbbd8b,.3),iris:mat(0x171b16,.2)},{skin:mat(0x66513b,.92),belly:mat(0xb09a76),ridge:mat(0x453729),eye:mat(0xd4c293,.3),iris:mat(0x171b16,.2)}];
const dinosaurs=[];let serial=0;
function makeDino(x,z,type){const palette=dinoMats[type],root=new THREE.Group();root.position.set(x,0,z);scene.add(root);root.userData={isDino:true,hp:2+type,maxHp:2+type,dead:false,speed:2.35+Math.random()*.9,phase:Math.random()*6,type};const bar=document.createElement('div');bar.className='dino-bar';bar.innerHTML='<div class="dino-bar-name">'+(type===0?'T-REX':'RAPTOR')+'</div><div class="dino-bar-track"><div class="dino-bar-fill"></div></div>';document.querySelector('#dino-bars').appendChild(bar);root.userData.barEl=bar;root.userData.barFill=bar.querySelector('.dino-bar-fill');const hitParts=[];const add=(mesh)=>{mesh.userData.dinoRoot=root;hitParts.push(mesh);return mesh};
const body=sphere(root,palette.skin,[0,1.55,0],[.9,.86,1.45],24);add(body);sphere(root,palette.belly,[0,1.22,.62],[.57,.49,.88],20);
const tail=sphere(root,palette.skin,[0,1.42,-1.72],[.38,.39,1.62],18);tail.rotation.x=-.12;add(tail);
const neck=sphere(root,palette.skin,[0,2.35,.75],[.48,.92,.52],20);neck.rotation.x=-.32;add(neck);
const head=sphere(root,palette.skin,[0,3.02,1.13],[.73,.61,.8],24);add(head);
const snout=sphere(root,palette.skin,[0,2.82,1.78],[.61,.3,.59],20);add(snout);
sphere(root,palette.belly,[0,2.62,1.72],[.43,.12,.45],16);
for(let side of [-1,1]){sphere(root,palette.ridge,[side*.48,3.04,1.3],[.17,.12,.13],12);sphere(root,palette.eye,[side*.53,3.12,1.35],[.14,.15,.12],16);sphere(root,palette.iris,[side*.57,3.12,1.445],[.065,.09,.045],12);sphere(root,mat(0xffffff,.15),[side*.59,3.17,1.48],[.025,.03,.02],8);
const arm=sphere(root,palette.skin,[side*.53,2.05,.84],[.2,.48,.22],12);arm.rotation.z=side*.35;const hand=sphere(root,palette.ridge,[side*.56,1.78,1],[.17,.15,.18],10);
const thigh=sphere(root,palette.skin,[side*.49,.83,.03],[.4,.67,.48],16);const shin=cylinder(root,palette.skin,[side*.49,.33,.34],.19,.25,.58,12);const foot=sphere(root,palette.ridge,[side*.5,.13,.58],[.3,.14,.43],12);for(let claw=0;claw<3;claw++)sphere(root,palette.belly,[side*.5+(claw-1)*.14,.1,.86],[.055,.055,.16],8)}
for(let i=0;i<8;i++){let xx=(i-3.5)*.16,zz=.55-i*.27,y=2.25+Math.sin((i/7)*Math.PI)*.28;const spike=new THREE.Mesh(new THREE.ConeGeometry(.09,.18,5),palette.ridge);spike.position.set(xx,y,zz);spike.rotation.x=-.25;spike.castShadow=true;root.add(spike);add(spike)}
// Face the approaching player along +Z.
root.rotation.y=0;root.userData.hitParts=hitParts;dinosaurs.push(root);return root}
function spawnDino(){let lanes=[-5.5,-3.3,-1.1,1.1,3.3,5.5],x=lanes[Math.floor(Math.random()*lanes.length)]+(Math.random()-.5)*.7;makeDino(x,camera.position.z-48-Math.random()*36,Math.floor(Math.random()*2))}
for(let i=0;i<5;i++)spawnDino();
let running=false,finished=false,progress=0,flash=0,aimX=.5,aimY=.5,dragging=false,shootRay=new THREE.Raycaster(),pointer=new THREE.Vector2(),clock=new THREE.Clock();const crosshair=document.querySelector('#crosshair');function placeCrosshair(){crosshair.style.left=(aimX*100)+'%';crosshair.style.top=(aimY*100)+'%'}placeCrosshair();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))}addEventListener('resize',resize);
function updateHUD(){document.querySelector('#distance').textContent=Math.max(0,Math.ceil(120-progress*3))+' m';document.querySelector('#count').textContent=dinosaurs.filter(d=>!d.userData.dead).length;for(const d of dinosaurs){const bar=d.userData.barEl;if(!bar)continue;d.userData.barFill.style.width=(Math.max(0,d.userData.hp)/d.userData.maxHp*100)+'%';d.userData.barFill.style.background=d.userData.hp/d.userData.maxHp<.35?'#ff5252':d.userData.hp/d.userData.maxHp<.7?'#ffd166':'#62e58b';const p=new THREE.Vector3(d.position.x,d.position.y+4.0,d.position.z).project(camera);const sx=(p.x*.5+.5)*innerWidth,sy=(-p.y*.5+.5)*innerHeight;const visible=p.z>-1&&p.z<1&&sx>0&&sx<innerWidth&&sy>0&&sy<innerHeight&&d.position.z<camera.position.z+2;bar.style.display=visible?'block':'none';bar.style.left=sx+'px';bar.style.top=sy+'px'}}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),elapsed=clock.elapsedTime;camera.position.x=Math.sin(elapsed*.18)*.035;camera.position.z=8-progress*.8;camera.position.y=2.25+Math.sin(elapsed*1.5)*.025;camera.lookAt(0,1.8,camera.position.z-38);
for(const d of dinosaurs){if(d.userData.dead)continue;d.position.z+=d.userData.speed*dt*(running?1:0);d.position.y=Math.abs(Math.sin(elapsed*4+d.userData.phase))*.035;if(d.position.z>camera.position.z+5){d.position.z=camera.position.z-65-Math.random()*28;let lanes=[-5.5,-3.3,-1.1,1.1,3.3,5.5];d.position.x=lanes[Math.floor(Math.random()*lanes.length)]+(Math.random()-.5)*.8;d.userData.hp=d.userData.maxHp;}}
if(running&&!finished){progress+=dt*.12;if(progress>=40){finished=true;running=false;document.querySelector('#panel').innerHTML='<h1>EXIT REACHED</h1><button id="start">RUN AGAIN ↻</button>';document.querySelector('#overlay').style.display='grid';document.querySelector('#start').onclick=start}}
if(flash>0)flash-=dt*3;renderer.render(scene,camera);updateHUD()}
function start(){progress=0;finished=false;running=true;crosshair.style.display='block';placeCrosshair();dinosaurs.forEach(d=>{scene.remove(d);d.userData.barEl?.remove()});dinosaurs.length=0;for(let i=0;i<5;i++)spawnDino();document.querySelector('#overlay').style.display='none'}
document.querySelector('#start').onclick=start;
function aimAt(e){const r=canvas.getBoundingClientRect();aimX=Math.max(.015,Math.min(.985,(e.clientX-r.left)/r.width));aimY=Math.max(.05,Math.min(.95,(e.clientY-r.top)/r.height));placeCrosshair()}
canvas.addEventListener('pointerdown',e=>{if(!running)return;dragging=true;canvas.setPointerCapture(e.pointerId);aimAt(e)});canvas.addEventListener('pointermove',e=>{if(running&&dragging)aimAt(e)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
document.querySelector('#aim').addEventListener('pointerdown',e=>{e.preventDefault();if(running){aimX=.5;aimY=.5;placeCrosshair()}});
document.querySelector('#shoot').addEventListener('pointerdown',e=>{e.preventDefault();if(!running)return;pointer.set(aimX*2-1,1-aimY*2);shootRay.setFromCamera(pointer,camera);const parts=[];for(const d of dinosaurs)if(!d.userData.dead)parts.push(...d.userData.hitParts);const hit=shootRay.intersectObjects(parts,false)[0];flash=.6;if(hit){const d=hit.object.userData.dinoRoot;d.userData.hp--;if(d.userData.hp<=0){d.userData.dead=true;scene.remove(d);const i=dinosaurs.indexOf(d);if(i>=0)dinosaurs.splice(i,1);d.userData.barEl?.remove();spawnDino()}}});
document.querySelector('#full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){}};
frame();
})();
</script></body></html>
