<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151b"><title>Dino Run | City Exit</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-shadow:0 2px 5px #000}.top{display:flex;justify-content:space-between;gap:8px}.pill{background:#101820c9;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;font-size:clamp(11px,1.7vw,14px);backdrop-filter:blur(8px)}.big{font-weight:950;letter-spacing:.1em;font-size:clamp(15px,2.3vw,23px)}#help{align-self:center;margin-top:auto;margin-bottom:9px;font-size:clamp(10px,1.5vw,13px);color:#dce8e9;text-align:center;background:#101820a8;padding:6px 10px;border-radius:20px}#controls{position:fixed;inset:auto 0 0;display:flex;justify-content:space-between;align-items:end;padding:12px;pointer-events:none}.control{pointer-events:auto;border:1px solid #ffffff55;color:white;background:#101820c9;border-radius:50%;width:clamp(64px,10vw,88px);height:clamp(64px,10vw,88px);font-size:clamp(12px,1.8vw,16px);font-weight:900;box-shadow:0 5px 18px #0007;touch-action:none}.control:active{transform:scale(.94);background:#238a70}.right{display:flex;gap:10px;align-items:end}.small{width:44px;height:44px;font-size:18px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#071019df;backdrop-filter:blur(10px);padding:22px;text-align:center}#panel{width:min(280px,82vw);padding:24px 20px;border:1px solid #ffffff26;border-radius:18px;background:#101820b8;box-shadow:0 18px 70px #0008}h1{font-size:clamp(27px,5vw,39px);line-height:1;margin:0 0 20px;letter-spacing:.04em;white-space:nowrap;text-shadow:0 3px 18px #000}#start{border:0;border-radius:10px;background:#66edbc;color:#06231c;padding:12px 28px;font-weight:950;font-size:14px;letter-spacing:.08em;box-shadow:0 4px 22px #66edbc35}#rotate{display:none;position:fixed;inset:0;background:#101923;z-index:10;place-items:center;text-align:center;padding:30px}@media (orientation:portrait) and (max-width:700px){#rotate{display:grid}}@media(orientation:landscape){#controls{padding:8px 15px}#help{margin-bottom:3px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="pill"><div class="big">DINO RUN</div><div>SECTOR 01 / OLD TOWN</div></div><div class="pill">EXIT <b id="distance">120 m</b><br>THREATS <b id="count">7</b></div></div><div id="help">DRAG ANYWHERE TO AIM · PULSE SHOOTS EXACTLY AT THE CROSSHAIR</div></div><div id="controls"><button class="control" id="aim">AIM<br>↗</button><div class="right"><button class="control small" id="full">⛶</button><button class="control" id="shoot">PULSE<br>●</button></div></div><div id="overlay"><div id="panel"><h1>DINO RUN</h1><button id="start">PLAY ▶</button></div></div><div id="rotate"><div><div style="font-size:46px">↻</div><h2>ROTATE YOUR PHONE</h2><p>Designed for landscape mode.</p></div></div><script>
(function(){
const c=document.getElementById('game'),g=c.getContext('2d');let w=0,h=0,dpr=1,t=0,progress=0,playing=false,flash=0,done=false,aimX=.5,aimY=.52,dragging=false,seed=42,dinos=[];
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function spawn(){dinos=[];for(let i=0;i<7;i++)dinos.push({z:.22+i*.105,lane:rand()*1.5-.75,type:1+Math.floor(rand()*3),hp:1+Math.floor(rand()*3),phase:rand()*8,alive:true})}spawn();
function poly(p,col){g.beginPath();p.forEach((a,i)=>i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]));g.closePath();g.fillStyle=col;g.fill()}
function line(x1,y1,x2,y2,col,width=1){g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function facade(bx,by,bw,bh,side,seedN){let wall=side==='L'?'#655e55':'#69665d';g.fillStyle=wall;g.fillRect(bx,by-bh,bw,bh);g.fillStyle='#777064';for(let grit=0;grit<Math.min(90,Math.floor(bw*bh/95));grit++){let gx=bx+rand()*bw,gy=by-bh+rand()*bh;g.globalAlpha=.06+rand()*.12;g.fillRect(gx,gy,1+rand()*3,1+rand()*2)}g.globalAlpha=1;g.fillStyle='#393a37';g.fillRect(bx,by-bh,bw,Math.max(2,bh*.025));g.fillStyle='#8d8575';g.fillRect(bx,by-bh,bw,Math.max(2,bh*.012));let cols=Math.max(2,Math.floor(bw/25)),rows=Math.max(2,Math.floor(bh/31));for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){let ww=Math.max(2,(bw-12)/cols-5),xx=bx+6+q*(bw-12)/cols,yy=by-bh+10+r*(bh-15)/rows;g.fillStyle='#292f30';g.fillRect(xx-2,yy-2,ww+4,Math.max(5,bh/rows*.57));g.fillStyle='#1b2426';g.fillRect(xx,yy,ww,Math.max(4,bh/rows*.48));g.fillStyle=((r*7+q*3+seedN)%6===0)?'#b4a17d':'#536a70';g.fillRect(xx+1,yy+1,Math.max(1,ww-2),Math.max(3,bh/rows*.43));g.fillStyle='#d6d5c4';g.globalAlpha=.25;g.beginPath();g.moveTo(xx+ww*.15,yy+2);g.lineTo(xx+ww*.4,yy+2);g.lineTo(xx+ww*.75,yy+bh/rows*.38);g.lineTo(xx+ww*.52,yy+bh/rows*.38);g.closePath();g.fill();g.globalAlpha=1;line(xx,yy+2,xx+ww,yy+2,'#ffffff30',1);g.fillStyle='#a69c88';g.fillRect(xx-2,yy+bh/rows*.48,ww+4,Math.max(1,bh*.003));if((r+q+seedN)%4===0){g.fillStyle='#4b4940';g.fillRect(xx-3,yy+bh/rows*.55,ww+6,Math.max(2,bh/rows*.09))}}// stains and facade seams
for(let k=0;k<4;k++){let sx=bx+bw*((k*37+seedN*13)%87)/100;g.fillStyle='#302f2b30';g.fillRect(sx,by-bh+bh*.15,bw*.025,bh*.68)}g.fillStyle='#a29a89';g.fillRect(bx,by-4,bw,4);g.fillStyle='#3b3b36';for(let k=0;k<Math.floor(bw/17);k++)g.fillRect(bx+4+k*17,by-3,7,2)}
function dino(d){if(!d.alive)return;let z=Math.max(.05,d.z),dx=w/2+d.lane*w*.28*z,dy=h*.58+(z-.4)*h*.55,s=.22+z*1.35,col=['#647e4d','#94714d','#77758a'][d.type-1];g.save();g.translate(dx,dy+Math.sin(t*4+d.phase)*2*s);g.scale(s,s);g.fillStyle='#0008';g.beginPath();g.ellipse(0,7,21,6,0,0,Math.PI*2);g.fill();g.strokeStyle='#3e503b';g.lineWidth=9;g.beginPath();g.moveTo(-8,-8);g.lineTo(-24,-14);g.stroke();g.fillStyle=col;g.beginPath();g.ellipse(-1,-10,14,16,-.2,0,Math.PI*2);g.fill();g.fillStyle='#81976a';g.beginPath();g.ellipse(8,-24,12,10,-.08,0,Math.PI*2);g.fill();g.fillStyle='#4c5544';g.fillRect(9,-20,17,5);g.fillStyle='#e4dfc8';g.beginPath();g.arc(11,-26,3,0,Math.PI*2);g.fill();g.fillStyle='#161b18';g.beginPath();g.arc(12,-26,1.6,0,Math.PI*2);g.fill();g.strokeStyle='#414c38';g.lineWidth=5;g.beginPath();g.moveTo(-5,0);g.lineTo(-7,6);g.moveTo(5,0);g.lineTo(8,6);g.stroke();g.restore();if(z>.35){g.fillStyle='#151b1b';g.fillRect(dx-15*s,dy-45*s,30*s,4);g.fillStyle='#a8d887';g.fillRect(dx-15*s,dy-45*s,30*s*(d.hp/(d.type+1)),4)}}
function draw(){t+=.016;g.clearRect(0,0,w,h);let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#526d78');sky.addColorStop(.34,'#9b9c91');sky.addColorStop(.51,'#6d7068');sky.addColorStop(1,'#171d1c');g.fillStyle=sky;g.fillRect(0,0,w,h);
// haze and skyline
g.fillStyle='#d3c7a2';g.beginPath();g.arc(w*.76,h*.16,Math.min(w,h)*.045,0,Math.PI*2);g.fill();for(let i=0;i<18;i++){let bx=i*w/18,bh=h*(.06+(i*37%11)/100);g.fillStyle=['#677a78','#7b8580','#5c706e'][i%3];g.fillRect(bx,h*.49-bh,w/18+1,bh);for(let k=0;k<4;k++){g.fillStyle='#b5b29a55';g.fillRect(bx+4+k*8,h*.49-bh+8,3,5)}}
let hz=h*.49,vp=w*.5;poly([[vp-4,hz],[vp+4,hz],[w*.99,h],[w*.01,h]],'#343a39');poly([[vp-2,hz],[vp+2,hz],[w*.76,h],[w*.24,h]],'#4a4d49');
// sidewalk slabs
poly([[vp-11,hz],[vp-5,hz],[w*.24,h],[w*.035,h]],'#888578');poly([[vp+5,hz],[vp+11,hz],[w*.965,h],[w*.76,h]],'#888578');
for(let i=0;i<18;i++){let z=((i/18+progress*.58)%1),yy=hz+(h-hz)*z*z,half=w*(.055+.185*z*z);line(vp-half,yy,vp+half,yy,'#c1b7a266',1+z*2);line(vp-half*.55,yy,vp-half*.55,yy+2+z*12,'#343b3860',1);}
// asphalt grain, subtle deterministic speckles
seed=14;for(let i=0;i<260;i++){let z=rand(),xx=w*(.25+rand()*.5),yy=hz+(h-hz)*z*z;if(xx>w*.32&&xx<w*.68){g.fillStyle=rand()>.5?'#d0c7ac38':'#1118174a';g.fillRect(xx,yy,1+z*2,1+z*2)}}
// road markings perspective
for(let i=0;i<9;i++){let z=((i/9+progress*.38)%1),yy=hz+(h-hz)*z*z,ww=w*.006*z*z;g.fillStyle='#c8bda0';g.fillRect(vp-ww/2,yy,Math.max(1,ww),2+22*z*z)}
['L','R'].forEach(side=>{for(let j=0;j<6;j++){let z=((j/6+progress*.19)%1),base=hz+(h*.98-hz)*z*z,scale=.12+z*1.6,bw=w*.12*scale,bh=h*(.23+(j%3)*.035)*scale,bx=side==='L'?vp-(w*.045+bw)*scale:vp+(w*.045)*scale;facade(bx,base,bw,bh,side,j+Math.floor(progress*4));if(z>.2){g.fillStyle='#d6a95d';g.fillRect(side==='L'?bx+bw-7*scale:bx+4*scale,base-bh*.56,3*scale,7*scale)}}
// streetlights
for(let j=0;j<3;j++){let z=((j/3+progress*.2)%1),base=hz+(h*.92-hz)*z*z,scale=.12+z*1.4,lx=side==='L'?vp-w*.12*scale:vp+w*.12*scale;line(lx,base,lx,base-h*.19*scale,'#343b39',Math.max(1,3*scale));line(lx,base-h*.19*scale,lx+(side==='L'?1:-1)*13*scale,base-h*.19*scale,'#343b39',Math.max(1,3*scale));g.fillStyle='#c7b68b';g.fillRect(lx+(side==='L'?8:-12)*scale,base-h*.195*scale,5*scale,3*scale)}});
// cracks on asphalt
for(let i=0;i<9;i++){let z=((i/9+progress*.47)%1),yy=hz+(h-hz)*z*z,xx=w*(.32+rand()*.36);line(xx,yy,xx+(rand()-.5)*20*z,yy+3+15*z,'#171c1b70',1+z)}
// weathered parked cars in far distance / foreground
for(let i=0;i<3;i++){let z=((i/3+progress*.14+.2)%1),scale=.1+z*.75,side=i%2?-1:1,cx=vp+side*w*(.14+.14*z*z),cy=hz+(h-hz)*z*z;g.save();g.translate(cx,cy);g.scale(scale,scale);g.fillStyle='#202725';g.beginPath();g.ellipse(0,0,37,12,0,0,Math.PI*2);g.fill();g.fillStyle=['#58645f','#77756a','#4c5b61'][i];g.beginPath();g.moveTo(-34,-5);g.lineTo(-26,-19);g.lineTo(-10,-24);g.lineTo(13,-22);g.lineTo(28,-9);g.lineTo(34,-5);g.closePath();g.fill();g.fillStyle='#303c3e';poly([[-18,-18],[-8,-22],[4,-21],[12,-10],[-22,-10]],'#303c3e');g.fillStyle='#8ca1a0';g.globalAlpha=.45;poly([[-15,-17],[-7,-20],[2,-19],[8,-11],[-18,-11]],'#8ca1a0');g.globalAlpha=1;g.fillStyle='#b3a98c';g.fillRect(24,-8,5,3);g.fillStyle='#1b201f';g.beginPath();g.arc(-20,0,6,0,Math.PI*2);g.arc(22,0,6,0,Math.PI*2);g.fill();g.restore()}
// distant exit gate
let es=.2+Math.min(1,progress/8)*.8,ey=hz,ew=w*.13*es,eh=h*.22*es;g.fillStyle='#3d4945';g.fillRect(vp-ew/2,ey-eh,ew,eh);g.fillStyle='#7e9b8a';g.fillRect(vp-ew*.37,ey-eh*.79,ew*.74,eh*.79);g.fillStyle='#243b35';g.fillRect(vp-ew*.3,ey-eh*.7,ew*.6,eh*.7);g.fillStyle='#e6e0c8';g.font='900 '+Math.max(7,12*es)+'px system-ui';g.textAlign='center';g.fillText('EXIT',vp,ey-eh*.82);
// first person silhouette / hands
g.fillStyle='#121a1b';g.beginPath();g.ellipse(w*.5,h*1.06,w*.11,h*.2,0,Math.PI,Math.PI*2);g.fill();g.fillStyle='#323d3b';poly([[w*.43,h],[w*.455,h*.91],[w*.5,h*.88],[w*.545,h*.91],[w*.57,h]],'#323d3b');
// pulse device held in right hand
g.save();g.translate(w*.72,h*.92);g.rotate(-.13);g.fillStyle='#151c1d';g.beginPath();g.roundRect(-w*.025,-h*.08,w*.05,h*.16,7);g.fill();g.fillStyle='#4b625b';g.fillRect(-w*.019,-h*.075,w*.038,h*.09);g.fillStyle=flash>0?'#a7ffe0':'#42c6a0';g.fillRect(-w*.009,-h*.068,w*.018,h*.018);g.fillStyle='#202827';g.fillRect(-w*.016,h*.01,w*.032,h*.065);g.restore();
// dinos always rendered after world
dinos.slice().sort((a,b)=>a.z-b.z).forEach(dino);
// manually controlled reticle
if(playing){let rx=aimX*w,ry=aimY*h;g.strokeStyle='#e3fff4';g.lineWidth=1.7;g.beginPath();g.arc(rx,ry,11,0,Math.PI*2);g.moveTo(rx-22,ry);g.lineTo(rx-7,ry);g.moveTo(rx+7,ry);g.lineTo(rx+22,ry);g.moveTo(rx,ry-22);g.lineTo(rx,ry-7);g.moveTo(rx,ry+7);g.lineTo(rx,ry+22);g.stroke();if(flash>0){g.strokeStyle='#68edbd';g.lineWidth=4;g.beginPath();g.moveTo(w*.72,h*.88);g.lineTo(rx,ry);g.stroke();flash-=.09}}
document.getElementById('distance').textContent=Math.max(0,Math.ceil(120-progress*15))+' m';document.getElementById('count').textContent=dinos.filter(d=>d.alive).length;if(playing&&!done){progress+=.00075;if(progress>8){done=true;playing=false;document.getElementById('panel').innerHTML='<h1>EXIT REACHED</h1><p>You made it through the old town.</p><button id="start">RUN AGAIN ↻</button>';document.getElementById('overlay').style.display='grid';document.getElementById('start').onclick=start}}requestAnimationFrame(draw)}
function start(){progress=0;done=false;playing=true;spawn();document.getElementById('overlay').style.display='none'}
document.getElementById('start').onclick=start;
function moveAim(e){let r=c.getBoundingClientRect();aimX=Math.max(.02,Math.min(.98,(e.clientX-r.left)/r.width));aimY=Math.max(.08,Math.min(.88,(e.clientY-r.top)/r.height))}
c.addEventListener('pointerdown',e=>{if(!playing)return;dragging=true;c.setPointerCapture(e.pointerId);moveAim(e)});c.addEventListener('pointermove',e=>{if(playing&&dragging)moveAim(e)});c.addEventListener('pointerup',()=>dragging=false);c.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('aim').addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;aimX=.5;aimY=.5});
document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;flash=1;let hit=null,dist=Infinity;for(let d of dinos){if(!d.alive)continue;let z=Math.max(.05,d.z),dx=w/2+d.lane*w*.28*z,dy=h*.58+(z-.4)*h*.55,s=.22+z*1.35,rr=Math.max(9,14*s),dd=Math.hypot(aimX*w-dx,aimY*h-(dy-14*s));if(dd<rr&&dd<dist){hit=d;dist=dd}}if(hit){hit.hp--;if(hit.hp<=0){hit.alive=false;if(dinos.filter(d=>d.alive).length<3)for(let i=0;i<4;i++)dinos.push({z:.2+rand()*.65,lane:rand()*1.5-.75,type:1+Math.floor(rand()*3),hp:1+Math.floor(rand()*3),phase:rand()*8,alive:true})}});
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}};
draw();
})();
</script></body></html>
